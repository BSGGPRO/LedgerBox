name: iOS Unsigned Archive

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

concurrency:
  group: ios-unsigned-${{ github.ref }}
  cancel-in-progress: true

jobs:
  archive:
    name: Build unsigned IPA
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch Qwen2.5-0.5B-Instruct GGUF
        run: |
          set -euo pipefail
          mkdir -p Models
          curl -L --fail --retry 3 --retry-delay 2 \
            -o Models/Qwen2.5-0.5B-Instruct-Q4_K_M.gguf \
            https://hf-mirror.com/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/qwen2.5-0.5b-instruct-q4_k_m.gguf
          echo "74A4DA8C9FDBCD15BD1F6D01D621410D31C6FC00986F5EB687824E7B93D7A9DB  Models/Qwen2.5-0.5B-Instruct-Q4_K_M.gguf" | shasum -a 256 -c -
          ls -lh Models/Qwen2.5-0.5B-Instruct-Q4_K_M.gguf

      - name: Show Xcode
        run: |
          xcodebuild -version
          xcodebuild -showsdks

      - name: Build unsigned archive
        run: |
          set -euo pipefail
          mkdir -p build
          xcodebuild \
            -project LedgerBox.xcodeproj \
            -scheme LedgerBox \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            -archivePath build/LedgerBox.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          rm -rf build/ipa
          mkdir -p build/ipa/Payload
          cp -R build/LedgerBox.xcarchive/Products/Applications/LedgerBox.app build/ipa/Payload/
          cd build/ipa
          zip -r -X ../LedgerBox-unsigned.ipa Payload

      - name: Verify artifact exists
        run: |
          set -euo pipefail
          test -f build/LedgerBox-unsigned.ipa
          unzip -l build/LedgerBox-unsigned.ipa | grep -E 'Payload/LedgerBox.app/LedgerBox$'
          unzip -l build/LedgerBox-unsigned.ipa | grep -E 'Payload/LedgerBox.app/FinanceMindWeights.bin$'
          unzip -l build/LedgerBox-unsigned.ipa | grep -E 'Payload/LedgerBox.app/Qwen2.5-0.5B-Instruct-Q4_K_M.gguf$'
          unzip -l build/LedgerBox-unsigned.ipa | grep -E 'Payload/LedgerBox.app/Frameworks/llama.framework/llama$'
          if unzip -l build/LedgerBox-unsigned.ipa | grep -q 'PlugIns/'; then
            echo "Unexpected PlugIns in unsigned IPA" >&2
            exit 1
          fi
          ls -lh build/LedgerBox-unsigned.ipa

      - name: Record artifact metadata
        run: |
          set -euo pipefail
          IPA=build/LedgerBox-unsigned.ipa
          SIZE=$(stat -f%z "$IPA")
          HASH=$(shasum -a 256 "$IPA" | awk '{print $1}')
          unzip -l "$IPA" > build/ipa-listing.txt
          cat > build/artifact-info.txt <<EOF
          version=0.12.0
          build=18
          size=$SIZE
          sha256=$HASH
          run=${{ github.run_id }}
          commit=${{ github.sha }}
          EOF
          cat build/artifact-info.txt
          grep -E 'Qwen2.5-0.5B-Instruct-Q4_K_M.gguf$|Frameworks/llama.framework/llama$' build/ipa-listing.txt

      - name: Upload artifact metadata
        uses: actions/upload-artifact@v4
        with:
          name: LedgerBox-0.12.0-metadata
          path: build/artifact-info.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish 0.12.0 release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          IPA=build/LedgerBox-unsigned.ipa
          SIZE=$(stat -f%z "$IPA")
          HASH=$(shasum -a 256 "$IPA" | awk '{print $1}')
          BODY=$(cat <<EOF
          ## LedgerBox 0.12.0

          ### Added
          - 新增“AI 财务日志诊断”：读取最近 30 天流水，生成分类、金额、时间结构化文本，由本机 Qwen 输出财务健康度体检、消费漏洞诊断和 3 条教练建议。
          - 财务大脑新增固定底部输入栏：加号上传图片、圆角输入框、发送按钮；建议气泡改为填充输入框并自动聚焦。
          - 设置 AI 区合并为“财务大脑”单一入口，详情页分别展示 40 个核心路由意图和 Qwen 本地解释引擎状态。

          ### Changed
          - 首页移除胶囊顶栏，改用原生大标题导航栏；月份副标题位于标题下方，头像移入右上角 toolbar。
          - 图片记账弹窗移除胶囊顶栏，改用标准 Modal 导航栏和右上角系统 xmark。

          ### Bundled
          - Qwen2.5-0.5B-Instruct Q4_K_M, 491,400,032 bytes
          - llama.cpp b11796 iOS framework, ios-arm64
          - Model SHA-256: 74A4DA8C9FDBCD15BD1F6D01D621410D31C6FC00986F5EB687824E7B93D7A9DB

          ### Verification
          - Unsigned archive: run ${{ github.run_id }}, commit ${{ github.sha }}.
          - IPA: $SIZE bytes.
          - IPA SHA-256: $HASH.
          - Embedded model and llama.framework verified by unzip listing.
          - 70 simulator XCTest cases pass in the iOS Tests workflow.
          - Not verified: physical-device install, on-device 0.5B generation, memory peak, thermal behavior, Metal, or screenshots.

          ### Limits
          - The app is unsigned and needs your own certificate/profile.
          - The 0.5B model is a language rewriter, not a calculator.
          - AI diagnosis is read-only and does not move money or modify the ledger.
          EOF
          )
          if gh release view v0.12.0 >/dev/null 2>&1; then
            gh release edit v0.12.0 --notes "$BODY"
            gh release upload v0.12.0 "$IPA" --clobber
          else
            gh release create v0.12.0 "$IPA" \
              --title "LedgerBox 0.12.0 — 原生导航、聊天输入与 AI 日志诊断" \
              --notes "$BODY" \
              --prerelease
          fi
          gh release view v0.12.0 --json url,assets

      - name: Upload unsigned IPA
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: LedgerBox-unsigned-ipa
          path: build/LedgerBox-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
