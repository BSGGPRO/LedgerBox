name: iOS Tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Run XCTest on simulator
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode and destinations
        run: |
          xcodebuild -version
          xcodebuild -project LedgerBox.xcodeproj -scheme LedgerBox -showdestinations

      - name: Select available iPhone simulator
        id: simulator
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl list devices available --json | /usr/bin/python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; c=[x for v in d.values() for x in v if x.get("isAvailable") and x.get("name", "").startswith("iPhone")]; assert c, "No available iPhone simulator"; p=next((x for x in c if x["name"] == "iPhone 16"), c[0]); print(p["udid"])')
          echo "Using simulator $UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Run tests
        run: |
          set -euo pipefail
          mkdir -p build
          xcodebuild test \
            -project LedgerBox.xcodeproj \
            -scheme LedgerBox \
            -configuration Debug \
            -destination "id=${{ steps.simulator.outputs.udid }}" \
            -derivedDataPath build/DerivedData \
            -resultBundlePath build/TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Print test failures
        if: always()
        run: |
          if [ -d build/TestResults.xcresult ]; then
            xcrun xcresulttool get test-results summary --path build/TestResults.xcresult || true
            xcrun xcresulttool get test-results tests --path build/TestResults.xcresult || true
          fi
