name: iOS Tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Run XCTest on simulator
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode and destinations
        run: |
          xcodebuild -version
          xcodebuild -project LedgerBox.xcodeproj -scheme LedgerBox -showdestinations

      - name: Run tests
        run: |
          set -euo pipefail
          mkdir -p build
          xcodebuild test \
            -project LedgerBox.xcodeproj \
            -scheme LedgerBox \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -derivedDataPath build/DerivedData \
            -resultBundlePath build/TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Print test failures
        if: always()
        run: |
          if [ -d build/TestResults.xcresult ]; then
            xcrun xcresulttool get test-results summary --path build/TestResults.xcresult || true
            xcrun xcresulttool get test-results tests --path build/TestResults.xcresult || true
          fi
